<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI P2P Payment</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f6;
        }
        .container {
            padding: 20px;
        }
        .bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 12px;
            box-shadow: 0 -2px 5px rgba(0,0,0,.15);
        }
        .pay {
            display: block;
            text-align: center;
            background: #fb641b;
            color: #fff;
            padding: 14px;
            border-radius: 4px;
            font-size: 18px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h3>Complete P2P Payment</h3>
    <p>Amount: <b>₹499</b></p>
    <p id="status" style="color: #666; font-size: 14px;">Click Pay to open UPI app</p>
</div>

<div class="bottom">
    <a id="payBtn" class="pay">Pay ₹499</a>
</div>

<script>
    (function() {
        const amount = "499";  // Change if needed

        // 🔥 Very important: Replace this with REAL VPA (UPI ID) of the receiver
        // Examples:
        // Paytm     -> mahinder123@paytm
        // PhonePe   -> 9xxxxxxxxx@ybl
        // Google Pay-> yourname@okaxis or @oksbi
        // Any UPI   -> yourid@upi
        const payeeVpa = "YOUR_REAL_VPA_HERE@paytm";  // <--- YAHAN CHANGE KAR

        const params = {
            pa: payeeVpa,                  // Payee Address (VPA) - MUST BE REAL
            pn: "Mahinder Brother",        // Payee Name (shows in app)
            am: amount,                    // Amount
            cu: "INR",                     // Currency
            tr: "P2P" + Date.now(),        // Transaction Ref - unique
            tn: "P2P Payment for help",    // Transaction Note (shows as remark)
            // mode: "02"                  // Removed for pure P2P - some apps reject it
        };

        let upiLink = "upi://pay?";
        Object.keys(params).forEach(key => {
            if (params[key]) {
                upiLink += key + "=" + encodeURIComponent(params[key]) + "&";
            }
        });
        upiLink = upiLink.slice(0, -1);  // Remove last &

        console.log("Generated UPI Link:", upiLink);  // Check this in browser console (F12)

        const payBtn = document.getElementById("payBtn");
        payBtn.setAttribute("href", upiLink);

        // Desktop/mobile check + better feedback
        payBtn.addEventListener("click", function(e) {
            const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (!isMobile) {
                e.preventDefault();
                alert("Yeh UPI link mobile pe best kaam karta hai (UPI app khulega). Desktop pe QR code bana ke scan kar sakte ho.");
            } else {
                document.getElementById("status").innerText = "Opening UPI app...";
            }
        });
    })();
</script>

</body>
</html>
