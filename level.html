<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif }
body{ margin:0; background:#f1f3f6 }

.header{
  position:fixed; top:0; left:0; width:100%;
  background:#fff; z-index:1000;
  box-shadow:0 2px 4px rgba(0,0,0,.12)
}
.header-top{
  padding:12px 16px; display:flex; gap:12px;
  border-bottom:1px solid #eee
}
.header-space{ height:70px }

.card{
  background:#fff;
  border-radius:8px;
  margin:8px;
  padding:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

.bottom-bar{
  position:fixed;
  bottom:0; left:0;
  width:100%;
  background:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  box-shadow:0 -1px 3px rgba(0,0,0,.15)
}

.btn{
  background:#fb641b;
  color:#fff;
  border:none;
  padding:12px 22px;
  font-size:16px;
  border-radius:4px
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <strong>Payments</strong>
  </div>
</div>
<div class="header-space"></div>

<!-- PRODUCT -->
<div class="card">
  <h4>Product</h4>
  <p><b>Special Deal Item</b></p>
  <p>Amount: <b>₹469</b></p>
</div>

<div style="height:90px"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <b>₹469</b>
  <button class="btn" onclick="payNow()">Pay via UPI</button>
</div>

<script>
/* ================= FINAL FIXED VALUES ================= */

// 🔥 HARD-CODED PERSONAL UPI (CHAT & PAY CONFIRMED)
const upiId = "paytmqr6r16hh@ptys";
const amount = 469;

/* ================= PAYMENT FUNCTION ================= */
function payNow(){

  const txnId = "TXN" + Date.now();

  // ⚠️ PERSONAL UPI + SIMPLE INTENT = CHAT & PAY
  const upiUrl =
    "upi://pay?" +
    "pa=" + upiId +
    "&am=" + amount +
    "&cu=INR" +
    "&tr=" + txnId;

  // 🔴 DIRECT REDIRECT (IMPORTANT)
  window.location.href = upiUrl;
}
</script>

</body>
</html>
