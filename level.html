<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif }
body{ margin:0; background:#f1f3f6 }

.header{ position:fixed; top:0; left:0; width:100%; background:#fff; z-index:1000; box-shadow:0 2px 4px rgba(0,0,0,.12)}
.header-top{ padding:12px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid #eee }
.back-arrow{ width:10px; height:10px; border-left:2px solid #000; border-bottom:2px solid #000; transform:rotate(45deg); cursor:pointer }
.header img{ width:100%; display:block }
.header-space{ height:120px }

.card{ background:#fff; border-radius:8px; margin:8px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08)}

.product-row{ display:flex; gap:12px; align-items:center }
.product-img{
  width:70px;
  height:70px;
  object-fit:contain;
  border:1px solid #eee;
  border-radius:6px;
  padding:5px;
}
.product-name{ font-size:14px; font-weight:600 }
.product-price{ font-size:16px; font-weight:bold; margin-top:4px }

.pay-option{ display:flex; gap:12px; align-items:center; padding:12px; border:2px solid #ddd; border-radius:8px; margin-bottom:10px; cursor:pointer }
.pay-option.selected{ border-color:#2874f0; background:#f0f7ff }
.pay-option img{ width:28px; height:28px; object-fit:contain }

.price-row{ display:flex; justify-content:space-between; margin:8px 0; font-size:14px }
.free{ color:#388e3c; font-weight:600 }

.bottom-bar{ position:fixed; bottom:0; left:0; width:100%; background:#fff; padding:12px 16px; display:flex; justify-content:space-between; box-shadow:0 -1px 3px rgba(0,0,0,.1)}
.amount{ font-size:18px; font-weight:bold }
.btn{ background:#fb641b; color:#fff; border:none; padding:12px 24px; font-size:16px; border-radius:4px; cursor:pointer }
.btn:disabled{ background:#ccc; cursor:not-allowed }

/* MODAL STYLES */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 2000;
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 400px;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.modal-header h3 {
  margin: 0;
  color: #2874f0;
}

.close-btn {
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #666;
}

.upi-details {
  background: #f8f9fa;
  padding: 15px;
  border-radius: 8px;
  margin: 15px 0;
  border: 1px dashed #ddd;
}

.upi-details div {
  margin: 8px 0;
  display: flex;
  justify-content: space-between;
}

.upi-details .label {
  color: #666;
  font-size: 14px;
}

.upi-details .value {
  font-weight: 600;
  color: #333;
}

.action-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.secondary-btn {
  flex: 1;
  background: #f1f3f6;
  color: #333;
  border: 1px solid #ddd;
  padding: 12px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
}

.primary-btn {
  flex: 1;
  background: #2874f0;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
}

.manual-upi {
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #eee;
  text-align: center;
}

.manual-upi p {
  font-size: 12px;
  color: #666;
  margin-bottom: 5px;
}

.manual-upi .upi-id {
  background: #fff;
  padding: 8px;
  border-radius: 4px;
  border: 1px solid #2874f0;
  font-family: monospace;
  font-size: 14px;
  color: #2874f0;
  cursor: pointer;
  margin-top: 5px;
  display: inline-block;
}

.loading {
  text-align: center;
  padding: 20px;
}

.spinner {
  border: 3px solid #f3f3f3;
  border-top: 3px solid #2874f0;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.success-check {
  color: #388e3c;
  font-size: 48px;
  margin: 15px 0;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Payments</strong>
  </div>
  <img src="assets/images/head.jpg" alt="Flipkart Header">
</div>
<div class="header-space"></div>

<!-- PRODUCT -->
<div class="card" id="productCard">Loading...</div>

<!-- PAYMENT -->
<div class="card">
  <h4>Select Payment Method</h4>
  <div class="pay-option selected" data-method="phonepe">
    <img src="assets/images/phonepe-logo.webp" alt="PhonePe"> PhonePe
  </div>
  <div class="pay-option" data-method="paytm">
    <img src="assets/images/paytm.png" alt="Paytm"> Paytm
  </div>
  <div class="pay-option" data-method="gpay">
    <img src="assets/images/gpay.webp" alt="Google Pay"> Google Pay
  </div>
</div>

<!-- PRICE -->
<div class="card">
  <h4>Price Details</h4>
  <div class="price-row"><span>Price</span><span id="price">₹--</span></div>
  <div class="price-row"><span>Delivery</span><span class="free">FREE</span></div>
  <hr>
  <div class="price-row"><strong>Total</strong><strong id="total">₹--</strong></div>
</div>

<!-- ADDRESS -->
<div class="card" id="addressCard">Loading address...</div>

<div style="height:90px"></div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <div class="amount" id="bottomAmount">₹--</div>
  <button class="btn" id="orderBtn" disabled>Pay Now</button>
</div>

<!-- UPI MODAL -->
<div class="modal-overlay" id="upiModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Complete Payment</h3>
      <button class="close-btn" onclick="closeModal()">&times;</button>
    </div>
    
    <div id="modalBody">
      <!-- Content will be dynamically filled -->
    </div>
  </div>
</div>

<script>
let productId="", productName="", productPrice=0;
let upiId="", selectedMethod="phonepe";
let isPaymentInProgress = false;
let appCheckTimeout;

const PRODUCTS_API="https://flipback-production.up.railway.app/api/products";
const UPI_API="https://flipback-production.up.railway.app/api/upi";

/* GET PRODUCT ID */
function getProductId(){
  return new URLSearchParams(window.location.search).get("id");
}

/* LOAD UPI ID */
async function loadUPI(){
  try {
    const response = await fetch(UPI_API);
    const data = await response.json();
    upiId = data?.data?.upi_id || data?.upi_id || "test@upi";
  } catch (error) {
    console.error("Error loading UPI:", error);
    upiId = "test@upi";
  }
}

/* LOAD PRODUCT */
async function loadProduct(){
  productId = getProductId();
  if(!productId){ 
    alert("Product ID missing"); 
    return; 
  }

  try {
    const response = await fetch(PRODUCTS_API);
    const data = await response.json();

    const product = data.data.find(x =>
      String(x.id) === String(productId) || String(x._id) === String(productId)
    );

    if(!product){ 
      alert("Product not found"); 
      return; 
    }

    productName = product.name;
    productPrice = Number(product.discounted_price || product.price || 0);
    const img = product.main_image || product.image || "https://via.placeholder.com/80";

    document.getElementById('productCard').innerHTML = `
      <div class="product-row">
        <img src="${img}" class="product-img" alt="${productName}" onerror="this.src='https://via.placeholder.com/80'">
        <div>
          <div class="product-name">${productName}</div>
          <div class="product-price">₹${productPrice}</div>
        </div>
      </div>
    `;

    document.getElementById('price').innerText = 
    document.getElementById('total').innerText = 
    document.getElementById('bottomAmount').innerText = "₹" + productPrice;
    
    document.getElementById('orderBtn').disabled = false;
  } catch (error) {
    console.error("Error loading product:", error);
    alert("Failed to load product details");
  }
}

/* LOAD ADDRESS */
function loadAddress(){
  const address = JSON.parse(localStorage.getItem("userAddress") || "null");
  document.getElementById('addressCard').innerHTML = address ? `
    <b>${address.name}</b><br>${address.house}, ${address.city}<br>${address.phone}
  ` : "No address found";
}

/* MODAL FUNCTIONS */
function showModal(content){
  document.getElementById('modalBody').innerHTML = content;
  document.getElementById('upiModal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeModal(){
  document.getElementById('upiModal').style.display = 'none';
  document.body.style.overflow = 'auto';
  isPaymentInProgress = false;
  if(appCheckTimeout) clearTimeout(appCheckTimeout);
}

/* SHOW PAYMENT MODAL */
function showPaymentModal(){
  if(isPaymentInProgress) return;
  
  isPaymentInProgress = true;
  
  const txnId = "TXN" + Date.now() + Math.floor(Math.random() * 1000);
  const note = productName.substring(0, 30);
  
  const upiLinks = {
    phonepe: `phonepe://pay?pa=${upiId}&pn=Flipkart&am=${productPrice}&cu=INR&tn=${note}&tr=${txnId}`,
    gpay: `tez://upi/pay?pa=${upiId}&pn=Flipkart&am=${productPrice}&cu=INR&tn=${note}&tr=${txnId}`,
    paytm: `paytmmp://pay?pa=${upiId}&pn=Flipkart&am=${productPrice}&cu=INR&tn=${note}&tr=${txnId}`
  };
  
  const appNames = {
    phonepe: "PhonePe",
    gpay: "Google Pay",
    paytm: "Paytm"
  };
  
  const modalContent = `
    <div class="loading">
      <div class="spinner"></div>
      <p>Preparing payment request...</p>
    </div>
  `;
  
  showModal(modalContent);
  
  // Small delay to show loading
  setTimeout(() => {
    const finalContent = `
      <div class="upi-details">
        <div>
          <span class="label">Amount:</span>
          <span class="value">₹${productPrice}</span>
        </div>
        <div>
          <span class="label">Merchant:</span>
          <span class="value">Flipkart</span>
        </div>
        <div>
          <span class="label">Transaction ID:</span>
          <span class="value">${txnId}</span>
        </div>
      </div>
      
      <p style="text-align: center; margin: 15px 0; color: #666;">
        Click "Open ${appNames[selectedMethod]}" to complete payment
      </p>
      
      <div class="action-buttons">
        <button class="secondary-btn" onclick="closeModal()">Cancel</button>
        <button class="primary-btn" onclick="openUPIApp('${upiLinks[selectedMethod]}')">
          Open ${appNames[selectedMethod]}
        </button>
      </div>
      
      <div class="manual-upi">
        <p>Or manually copy this UPI ID to pay:</p>
        <div class="upi-id" onclick="copyUPIId()">
          ${upiId}
          <i class="fas fa-copy" style="margin-left: 5px;"></i>
        </div>
        <p style="font-size: 10px; margin-top: 8px; color: #999;">
          Click to copy. Open your UPI app and paste to pay.
        </p>
      </div>
      
      <div style="margin-top: 20px; padding: 10px; background: #f0f7ff; border-radius: 4px; font-size: 12px; color: #2874f0;">
        <i class="fas fa-info-circle"></i> After payment, click "Payment Done" button below
      </div>
    `;
    
    document.getElementById('modalBody').innerHTML = finalContent;
    
    // Start checking if user left the app (payment might be done)
    startPaymentStatusCheck(txnId);
    
  }, 800);
}

/* OPEN UPI APP WITH USER CONFIRMATION */
function openUPIApp(url){
  // Store timestamp when user opens the app
  localStorage.setItem('paymentStartTime', Date.now());
  
  // Open the UPI app
  window.location.href = url;
  
  // After 2 seconds, show payment confirmation option
  setTimeout(() => {
    showPaymentConfirmation();
  }, 2000);
}

/* SHOW PAYMENT CONFIRMATION */
function showPaymentConfirmation(){
  const confirmationContent = `
    <div style="text-align: center; padding: 20px;">
      <div class="success-check">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3 style="color: #388e3c;">Payment Initiated</h3>
      <p style="color: #666; margin: 15px 0;">
        Please complete the payment in your UPI app.
      </p>
      <p style="color: #999; font-size: 12px; margin-bottom: 20px;">
        If you've completed the payment, click below:
      </p>
      <div class="action-buttons">
        <button class="secondary-btn" onclick="closeModal()">
          Payment Failed
        </button>
        <button class="primary-btn" onclick="paymentSuccessful()">
          Payment Done
        </button>
      </div>
      <p style="font-size: 11px; color: #999; margin-top: 15px;">
        You can also check your UPI app for payment status.
      </p>
    </div>
  `;
  
  document.getElementById('modalBody').innerHTML = confirmationContent;
}

function paymentSuccessful(){
  if(appCheckTimeout) clearTimeout(appCheckTimeout);
  
  const successContent = `
    <div style="text-align: center; padding: 20px;">
      <div class="success-check">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3 style="color: #388e3c;">Payment Successful!</h3>
      <p style="color: #666; margin: 20px 0;">
        Your order has been placed successfully.
      </p>
      <button class="primary-btn" style="width: 100%;" onclick="redirectToThankYou()">
        View Order Details
      </button>
    </div>
  `;
  
  document.getElementById('modalBody').innerHTML = successContent;
  
  setTimeout(redirectToThankYou, 3000);
}

function redirectToThankYou(){
  window.location.href = `thankyou.html?id=${productId}`;
}

function copyUPIId(){
  navigator.clipboard.writeText(upiId).then(() => {
    const upiElement = document.querySelector('.upi-id');
    const originalText = upiElement.innerHTML;
    upiElement.innerHTML = 'Copied! <i class="fas fa-check"></i>';
    setTimeout(() => {
      upiElement.innerHTML = originalText;
    }, 2000);
  });
}

function startPaymentStatusCheck(txnId){
  appCheckTimeout = setTimeout(() => {
    if(isPaymentInProgress){
      showPaymentConfirmation();
    }
  }, 30000);
}

document.addEventListener('DOMContentLoaded', function() {
  loadUPI();
  
  loadProduct();
  loadAddress();
  
  document.querySelectorAll(".pay-option").forEach(p => {
    p.onclick = () => {
      document.querySelectorAll(".pay-option").forEach(x => x.classList.remove("selected"));
      p.classList.add("selected");
      selectedMethod = p.dataset.method;
    };
  });
  
  document.getElementById('orderBtn').onclick = showPaymentModal;
  
  document.addEventListener('visibilitychange', function() {
    if(document.visibilityState === 'visible' && isPaymentInProgress){
      setTimeout(() => {
        if(isPaymentInProgress){
          showPaymentConfirmation();
        }
      }, 1000);
    }
  });
});

window.addEventListener('beforeunload', function(e) {
  if(isPaymentInProgress){
    return undefined;
  }
});
</script>

</body>
</html>
