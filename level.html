<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Now</title>
<style>
body{font-family:Arial;background:#f1f3f6;margin:0}
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  box-shadow:0 -2px 5px rgba(0,0,0,.15);
}
.pay{
  display:block;
  text-align:center;
  background:#fb641b;
  color:#fff;
  padding:14px;
  border-radius:4px;
  font-size:18px;
  text-decoration:none;
}
</style>
</head>

<body>

<div style="padding:20px">
  <h3>Complete your payment</h3>
  <p>Amount: <b>₹499</b></p>
</div>

<div class="bottom">
  <a id="payBtn" class="pay">Pay ₹499</a>
</div>

<script>
(function(){
  const amount = "499";

  const upiParams = {
    pa: "paytm.s1xjfgt@pty",
    am: amount,
    cu: "INR",
    tr: "P2P" + Date.now(),
    mode: "02"
  };

  let upi = "upi://pay?";
  for (let k in upiParams) {
    upi += k + "=" + encodeURIComponent(upiParams[k]) + "&";
  }

  document.getElementById("payBtn").href = upi.slice(0, -1);
})();
</script>

</body>
</html>
