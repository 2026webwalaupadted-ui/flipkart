<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhonePe P2P Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f3f6;
}
.header{
  background:#fff;
  padding:14px;
  font-weight:bold;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
}
.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:8px;
}
.amount{
  font-size:28px;
  font-weight:bold;
  color:#5f259f;
  text-align:center;
}
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  box-shadow:0 -2px 5px rgba(0,0,0,.15);
}
.pay{
  display:block;
  text-align:center;
  background:#5f259f;
  color:#fff;
  padding:14px;
  border-radius:6px;
  font-size:18px;
  text-decoration:none;
}
.note{
  font-size:13px;
  color:#666;
  text-align:center;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="header">PhonePe Pay</div>

<div class="card">
  <h3>Special Deal</h3>
  <div class="amount">₹499</div>
  <p style="text-align:center;">Pay via PhonePe (P2P)</p>
</div>

<div class="bottom">
  <a id="payBtn" class="pay">Pay with PhonePe</a>
  <div class="note">Works on mobile only</div>
</div>

<script>
(function(){

  // 🔥 CONFIG (PERSONAL UPI ONLY)
  const AMOUNT = 499;
  const PAYEE_UPI = "paytm.s1xjfgt@pty"; // personal / VPA
  const PAYEE_NAME = "Shyam Veer";

  // SIMPLE + SAFE P2P INTENT
  function openPhonePe(){
    const txn = "TXN" + Date.now();

    const params =
      "pa=" + encodeURIComponent(PAYEE_UPI) +
      "&pn=" + encodeURIComponent(PAYEE_NAME) +
      "&am=" + AMOUNT +
      "&cu=INR" +
      "&tr=" + txn +
      "&tn=Payment";

    const url = "upi://pay?" + params;

    // 🔥 This is the ONLY officially supported way from web
    window.location.href = url;

    // Desktop / fail fallback
    setTimeout(() => {
      if (document.hasFocus()) {
        alert(
          "❌ PhonePe app open nahi hua\n\n" +
          "✔️ Mobile browser use karo\n" +
          "✔️ PhonePe install/update ho\n" +
          "✔️ Laptop pe ye kaam nahi karta"
        );
      }
    }, 2500);
  }

  document.getElementById("payBtn").onclick = openPhonePe;

})();
</script>

</body>
</html>
