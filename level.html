<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments - Chat & Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; }
body { background: #f1f3f6; padding-bottom: 100px; }
.header { 
  position: fixed; top: 0; left: 0; width: 100%; 
  background: #fff; z-index: 1000; box-shadow: 0 2px 4px rgba(0,0,0,.12); 
}
.header-top { 
  padding: 12px 16px; display: flex; align-items: center; gap: 12px; 
  border-bottom: 1px solid #eee; 
}
.back-arrow { 
  width: 10px; height: 10px; border-left: 2px solid #000; border-bottom: 2px solid #000; 
  transform: rotate(135deg); cursor: pointer; 
}
.header-space { height: 70px; }
.card { 
  background: #fff; border-radius: 8px; margin: 12px 16px; padding: 16px; 
  box-shadow: 0 1px 3px rgba(0,0,0,.08); 
}
.product-row { display: flex; gap: 12px; align-items: center; }
.product-img { width: 80px; height: 80px; border: 1px solid #eee; border-radius: 8px; object-fit: contain; }
.pay-option { 
  display: flex; align-items: center; gap: 12px; padding: 12px; 
  border: 2px solid #ddd; border-radius: 8px; margin-bottom: 12px; cursor: pointer; 
}
.pay-option img { width: 32px; height: 32px; }
.pay-option.selected { border-color: #2874f0; background: #f0f7ff; }
.price-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 15px; }
.amount-input-container { margin: 16px 0; }
.amount-input-container label { display: block; margin-bottom: 8px; font-weight: bold; }
.amount-input { 
  width: 100%; padding: 12px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; 
  text-align: right; 
}
.bottom-bar { 
  position: fixed; bottom: 0; left: 0; width: 100%; background: #fff; 
  padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; 
  box-shadow: 0 -2px 8px rgba(0,0,0,.1); z-index: 999; 
}
.btn { 
  background: #fb641b; color: #fff; border: none; padding: 14px 32px; font-size: 16px; 
  border-radius: 4px; font-weight: bold; cursor: pointer; 
}
.btn:disabled { background: #ccc; cursor: not-allowed; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Chat & Pay</strong>
  </div>
</div>

<div class="header-space"></div>

<div class="card" id="productCard">
  <p>Loading product details...</p>
</div>

<div class="card">
  <h4>Amount to Pay</h4>
  <div class="amount-input-container">
    <label for="payAmount">Enter amount (₹)</label>
    <input type="number" id="payAmount" class="amount-input" min="1" step="1" value="" placeholder="Enter amount">
  </div>
</div>

<div class="card">
  <h4>Select Payment App</h4>
  <div class="pay-option selected" data-method="phonepe">
    <img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/PhonePe_Logo.png" alt="PhonePe"> PhonePe
  </div>
  <div class="pay-option" data-method="gpay">
    <img src="https://upload.wikimedia.org/wikipedia/commons/c/c7/Google_Pay_Logo.svg" alt="Google Pay"> Google Pay
  </div>
  <div class="pay-option" data-method="paytm">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Paytm_Logo_%28standalone%29.svg" alt="Paytm"> Paytm
  </div>
</div>

<div style="height: 100px;"></div>

<div class="bottom-bar">
  <b id="bottomAmount">₹0</b>
  <button class="btn" id="payBtn" disabled>Continue to Chat & Pay</button>
</div>

<script>
// =============================================
// CONFIG - Change these as needed
// =============================================
const UPI_ID = "paytmqr6r16hhn@ptys";          // Your personal/business VPA
const PAYEE_NAME = "Shyam Veer Baking";         // Display name in app
const DEFAULT_AMOUNT = 0;                       // Will be updated from product or input

let selectedMethod = "phonepe";
let currentAmount = DEFAULT_AMOUNT;

// =============================================
// DOM Elements
// =============================================
const amountInput = document.getElementById("payAmount");
const bottomAmountEl = document.getElementById("bottomAmount");
const payBtn = document.getElementById("payBtn");

// =============================================
// Product Loading (optional - if coming from product page)
// =============================================
const qs = (key) => new URLSearchParams(location.search).get(key);

async function loadProduct() {
  try {
    const res = await fetch("https://flipback-production.up.railway.app/api/products");
    const data = await res.json();
    const product = data.data?.find(p => 
      String(p.id) === qs("id") || String(p._id) === qs("id")
    );

    if (product) {
      const price = Number(product.discounted_price || product.price || 0);
      if (price > 0) {
        currentAmount = price;
        amountInput.value = price;
        updateAmountDisplay();
      }

      document.getElementById("productCard").innerHTML = `
        <div class="product-row">
          <img src="${product.main_image || product.image || 'https://via.placeholder.com/80'}" class="product-img" alt="Product">
          <div>
            <strong>${product.name || "Selected Product"}</strong><br>
            <span style="color:#2874f0">₹${price}</span>
          </div>
        </div>
      `;
    } else {
      document.getElementById("productCard").innerHTML = "<p>Product not found. Enter amount manually.</p>";
    }
  } catch (err) {
    console.error("Product fetch failed:", err);
    document.getElementById("productCard").innerHTML = "<p>Could not load product. Enter amount manually.</p>";
  }
}

// =============================================
// Amount Handling
// =============================================
function updateAmountDisplay() {
  const amt = Number(amountInput.value) || 0;
  bottomAmountEl.textContent = "₹" + amt;
  payBtn.disabled = (amt <= 0);
}

amountInput.addEventListener("input", () => {
  currentAmount = Number(amountInput.value) || 0;
  updateAmountDisplay();
});

// =============================================
// Payment Method Selection
// =============================================
document.querySelectorAll(".pay-option").forEach(opt => {
  opt.addEventListener("click", () => {
    document.querySelectorAll(".pay-option").forEach(o => o.classList.remove("selected"));
    opt.classList.add("selected");
    selectedMethod = opt.dataset.method;
  });
});

// =============================================
// Pay Function - Opens Chat & Pay flow (amount editable in app)
// =============================================
function initiatePayment() {
  const amount = Number(amountInput.value);
  if (amount <= 0) {
    alert("Please enter a valid amount");
    return;
  }

  const transactionId = "ORD" + Date.now();

  const baseParams = [
    `pa=${encodeURIComponent(UPI_ID)}`,
    `pn=${encodeURIComponent(PAYEE_NAME)}`,
    `am=${amount}`,
    `cu=INR`,
    `tr=${encodeURIComponent(transactionId)}`,
    `tn=Payment for Shyam Veer Baking`
  ].join("&");

  let scheme = "upi://pay?";
  let appSpecific = "";

  if (selectedMethod === "phonepe") {
    scheme = "phonepe://pay?";
    // PhonePe often shows chat-like interface with amount prefilled but editable
  } else if (selectedMethod === "gpay") {
    scheme = "tez://upi/pay?";
    // Google Pay usually opens with amount editable
  } else if (selectedMethod === "paytm") {
    scheme = "paytmmp://pay?";
    // Paytm opens payment screen - amount mostly editable
  }

  const fullUrl = scheme + baseParams;

  console.log("Launching UPI:", fullUrl);

  // Open the deep link
  window.location.href = fullUrl;

  // Fallback message if app doesn't open
  setTimeout(() => {
    if (document.hasFocus()) {
      alert("App nahi khula?\n1. Confirm karo ki app installed hai\n2. Browser se bahar nikal ke try karo\n3. Amount check karo\n4. Console (F12) mein URL dekho");
    }
  }, 4000);
}

payBtn.addEventListener("click", initiatePayment);

// Init
loadProduct();
updateAmountDisplay();
</script>
</body>
</html>
