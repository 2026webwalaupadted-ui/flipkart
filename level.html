<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f3f6}

.header{
  position:fixed;top:0;left:0;width:100%;
  background:#fff;z-index:10;
  box-shadow:0 2px 4px rgba(0,0,0,.12)
}
.header-top{
  padding:12px 16px;
  display:flex;gap:12px;
  border-bottom:1px solid #eee
}
.back-arrow{
  width:10px;height:10px;
  border-left:2px solid #000;
  border-bottom:2px solid #000;
  transform:rotate(45deg);
  cursor:pointer
}
.header-space{height:70px}

.card{
  background:#fff;
  border-radius:8px;
  margin:10px;
  padding:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.1)
}

.product-row{display:flex;gap:12px}
.product-img{
  width:70px;height:70px;
  object-fit:contain;
  border:1px solid #eee;
  border-radius:6px;padding:5px
}
.product-name{font-size:14px;font-weight:600}
.product-price{font-size:16px;font-weight:bold;margin-top:4px}

.pay-option{
  display:flex;gap:12px;
  padding:12px;
  border:2px solid #ddd;
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer
}
.pay-option.selected{
  border-color:#2874f0;
  background:#f0f7ff
}
.pay-option img{width:28px}

.price-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;font-size:14px
}
.free{color:#388e3c;font-weight:600}

.bottom-bar{
  position:fixed;bottom:0;left:0;width:100%;
  background:#fff;
  padding:12px 16px;
  display:flex;justify-content:space-between;
  box-shadow:0 -1px 3px rgba(0,0,0,.1)
}
.amount{font-size:18px;font-weight:bold}
.btn{
  background:#fb641b;color:#fff;
  border:none;padding:12px 24px;
  font-size:16px;border-radius:4px
}
.btn:disabled{background:#ccc}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Payments</strong>
  </div>
</div>
<div class="header-space"></div>

<!-- PRODUCT -->
<div class="card" id="productCard">Loading...</div>

<!-- PAYMENT -->
<div class="card">
  <h4>Select Payment App</h4>

  <div class="pay-option selected" data-method="upi">
    <img src="assets/images/upi.png"> Any UPI App
  </div>

  <div class="pay-option" data-method="phonepe">
    <img src="assets/images/phonepe-logo.webp"> PhonePe
  </div>

  <div class="pay-option" data-method="gpay">
    <img src="assets/images/gpay.webp"> Google Pay
  </div>

  <div class="pay-option" data-method="paytm">
    <img src="assets/images/paytm.png"> Paytm
  </div>
</div>

<!-- PRICE -->
<div class="card">
  <h4>Price Details</h4>
  <div class="price-row"><span>Price</span><span id="price">₹--</span></div>
  <div class="price-row"><span>Delivery</span><span class="free">FREE</span></div>
  <hr>
  <div class="price-row"><strong>Total</strong><strong id="total">₹--</strong></div>
</div>

<div style="height:90px"></div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <div class="amount" id="bottomAmount">₹--</div>
  <button class="btn" id="payBtn" disabled>Pay Now</button>
</div>

<script>
let productPrice = 399;               // demo amount
let productName  = "Order Payment";  // note
let upiId        = "yourupi@bank";   // 🔴 APNA UPI ID DALO
let selectedMethod = "upi";

/* LOAD DEMO PRODUCT */
function loadProduct(){
  productCard.innerHTML = `
    <div class="product-row">
      <img src="https://via.placeholder.com/80" class="product-img">
      <div>
        <div class="product-name">${productName}</div>
        <div class="product-price">₹${productPrice}</div>
      </div>
    </div>
  `;
  price.innerText = total.innerText = bottomAmount.innerText = "₹"+productPrice;
  payBtn.disabled = false;
}

/* PAYMENT OPEN */
function openUPI(){
  if(!upiId || productPrice<=0){
    alert("UPI unavailable");
    return;
  }

  const amt  = productPrice.toString();
  const note = encodeURIComponent(productName);

  let url = "";

  if(selectedMethod === "phonepe"){
    url = `phonepe://upi/pay?pa=${upiId}&am=${amt}&cu=INR&tn=${note}`;
  }
  else if(selectedMethod === "gpay"){
    url = `tez://upi/pay?pa=${upiId}&am=${amt}&cu=INR&tn=${note}`;
  }
  else if(selectedMethod === "paytm"){
    url = `paytmmp://upi/pay?pa=${upiId}&am=${amt}&cu=INR&tn=${note}`;
  }
  else{
    // 🔥 MOST IMPORTANT (generic user-like payment)
    url = `upi://pay?pa=${upiId}&am=${amt}&cu=INR&tn=${note}`;
  }

  window.location.href = url;

  // OPTIONAL success redirect
  setTimeout(()=>{
    if(confirm("Payment completed?")) {
      window.location.href = "thankyou.html";
    }
  },3000);
}

/* PAYMENT SELECT */
document.querySelectorAll(".pay-option").forEach(p=>{
  p.onclick = ()=>{
    document.querySelectorAll(".pay-option")
      .forEach(x=>x.classList.remove("selected"));
    p.classList.add("selected");
    selectedMethod = p.dataset.method;
  };
});

payBtn.onclick = openUPI;
loadProduct();
</script>

</body>
</html>
