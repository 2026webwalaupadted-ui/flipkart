<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPI Pay</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f1f3f6;
}
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  box-shadow:0 -2px 5px rgba(0,0,0,.15);
}
.pay{
  display:block;
  text-align:center;
  background:#fb641b;
  color:#fff;
  padding:14px;
  border-radius:4px;
  font-size:18px;
  text-decoration:none;
}
</style>
</head>

<body>

<div style="padding:20px">
  <h3>Complete Payment</h3>
  <p>Amount: <b>₹499</b></p>
</div>

<div class="bottom">
  <a id="payBtn" class="pay">Pay ₹499</a>
</div>

<script>
(function(){

  const amount = "499";

  // 🔥 UPI PARAMS
  const params = {
    pa: "paytm.s1xjfgt@pty",
    am: amount,
    cu: "INR",
    tr: "P2P" + Date.now(),
    mode: "02"
  };

  // 🔥 BUILD ENCODED UPI URI
  let upi = "upi://pay?";
  Object.keys(params).forEach(key => {
    upi += key + "=" + encodeURIComponent(params[key]) + "&";
  });

  upi = upi.slice(0, -1); 

  document.getElementById("payBtn").setAttribute("href", upi);

})();
</script>

</body>
</html>
