<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Now</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f3f6;
}
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  box-shadow:0 -2px 5px rgba(0,0,0,.15);
}
.pay{
  display:block;
  text-align:center;
  background:#6739b7; /* PhonePe-style */
  color:#fff;
  padding:14px;
  border-radius:6px;
  font-size:18px;
  text-decoration:none;
}
</style>
</head>

<body>

<div style="padding:20px">
  <h3>Send Money</h3>
  <p>Amount: <b>₹499</b></p>
</div>

<div class="bottom">
  <a id="payBtn" class="pay">Pay ₹499</a>
</div>

<script>
(function(){

  const amount = "499";

  const params = {
    pa: "7759928878@ybl",        // ✅ Mobile-number UPI (P2P friendly)
    pn: "Personal Payment",     // optional but useful
    am: amount,
    cu: "INR",
    tr: "TXN" + Date.now()      // unique txn id
    // ❌ NO mode, NO mc, NO orgid
  };

  let upi = "upi://pay?";
  Object.keys(params).forEach(key => {
    upi += key + "=" + encodeURIComponent(params[key]) + "&";
  });
  upi = upi.slice(0, -1);

  document.getElementById("payBtn").href = upi;

})();
</script>

</body>
</html>
