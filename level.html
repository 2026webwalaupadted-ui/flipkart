<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f1f3f6}

.header{
  position:fixed;top:0;left:0;width:100%;
  background:#fff;z-index:10;
  box-shadow:0 2px 4px rgba(0,0,0,.12)
}
.header-top{
  padding:12px 16px;
  display:flex;gap:12px;
  border-bottom:1px solid #eee
}
.back-arrow{
  width:10px;height:10px;
  border-left:2px solid #000;
  border-bottom:2px solid #000;
  transform:rotate(45deg);
  cursor:pointer
}
.header-space{height:70px}

.card{
  background:#fff;
  border-radius:8px;
  margin:10px;
  padding:12px;
  box-shadow:0 1px 3px rgba(0,0,0,.1)
}

.product-row{display:flex;gap:12px}
.product-img{
  width:70px;height:70px;
  object-fit:contain;
  border:1px solid #eee;
  border-radius:6px;padding:5px
}
.product-name{font-size:14px;font-weight:600}
.product-price{font-size:16px;font-weight:bold;margin-top:4px}

.price-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;font-size:14px
}
.free{color:#388e3c;font-weight:600}

.bottom-bar{
  position:fixed;bottom:0;left:0;width:100%;
  background:#fff;
  padding:12px 16px;
  display:flex;justify-content:space-between;
  box-shadow:0 -1px 3px rgba(0,0,0,.1)
}
.amount{font-size:18px;font-weight:bold}
.btn{
  background:#fb641b;color:#fff;
  border:none;padding:12px 24px;
  font-size:16px;border-radius:4px
}
.btn:disabled{background:#ccc}
.note{
  font-size:13px;
  color:#555;
  margin-top:8px
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Payments</strong>
  </div>
</div>
<div class="header-space"></div>

<!-- PRODUCT -->
<div class="card" id="productCard">Loading...</div>

<!-- PRICE -->
<div class="card">
  <h4>Price Details</h4>
  <div class="price-row"><span>Price</span><span id="price">₹--</span></div>
  <div class="price-row"><span>Delivery</span><span class="free">FREE</span></div>
  <hr>
  <div class="price-row"><strong>Total</strong><strong id="total">₹--</strong></div>

  <div class="note">
    You will be redirected to Paytm.<br>
    Amount will be already filled. Just confirm & pay.
  </div>
</div>

<div style="height:90px"></div>

<!-- BOTTOM -->
<div class="bottom-bar">
  <div class="amount" id="bottomAmount">₹--</div>
  <button class="btn" id="orderBtn" disabled>Pay Now</button>
</div>

<script>
/* ================= CONFIG ================= */
let productId = "";
let productName = "";
let productPrice = 0;
let upiId = "";

const PRODUCTS_API = "https://flipback-production.up.railway.app/api/products";
const UPI_API      = "https://flipback-production.up.railway.app/api/upi";

/* =============== HELPERS ================== */
function getProductId(){
  return new URLSearchParams(window.location.search).get("id");
}

/* =============== FETCH UPI ================= */
fetch(UPI_API)
  .then(r => r.json())
  .then(d => {
    upiId = d?.data?.upi_id || d?.upi_id || "";
  });

/* =============== LOAD PRODUCT ============== */
async function loadProduct(){
  productId = getProductId();
  if(!productId){
    alert("Product ID missing");
    return;
  }

  const r = await fetch(PRODUCTS_API);
  const d = await r.json();

  const p = d.data.find(x =>
    String(x.id) === String(productId) ||
    String(x._id) === String(productId)
  );

  if(!p){
    alert("Product not found");
    return;
  }

  productName  = p.name;
  productPrice = Number(p.discounted_price || p.price || 0);
  const img    = p.main_image || p.image || "https://via.placeholder.com/80";

  productCard.innerHTML = `
    <div class="product-row">
      <img src="${img}" class="product-img"
           onerror="this.src='https://via.placeholder.com/80'">
      <div>
        <div class="product-name">${productName}</div>
        <div class="product-price">₹${productPrice}</div>
      </div>
    </div>
  `;

  price.innerText =
  total.innerText =
  bottomAmount.innerText = "₹" + productPrice;

  orderBtn.disabled = false;
}

/* ========== PAYTM USER-INITIATED FLOW ========= */
function openPaytmUserFlow(){
  if(!upiId || productPrice <= 0){
    alert("Payment unavailable");
    return;
  }

  /*
    IMPORTANT:
    ❌ NO upi://pay
    ❌ NO paytmmp://pay
    ✅ ONLY internal Paytm transfer screen
  */

  const amount = productPrice;

  // Paytm internal send-money screen (user initiated)
  const paytmUrl =
    `paytmmp://cash_wallet?featuretype=sendmoney&amount=${amount}`;

  window.location.href = paytmUrl;

  // Optional confirmation screen
  setTimeout(() => {
    if(confirm("Payment completed in Paytm?")){
      window.location.href = `thankyou.html?id=${productId}`;
    }
  }, 4000);
}

/* =============== INIT ================= */
orderBtn.onclick = openPaytmUserFlow;
loadProduct();
</script>

</body>
</html>
