<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f1f3f6;
}

/* Header */
.header{
  position:fixed;
  top:0;
  width:100%;
  background:#fff;
  padding:14px;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 2px 4px rgba(0,0,0,.15);
  z-index:10;
}

/* Card */
.card{
  background:#fff;
  margin:80px 14px 120px;
  padding:16px;
  border-radius:8px;
}

.card h3{
  margin:0 0 10px;
}

.price{
  font-size:20px;
  font-weight:bold;
}

/* Bottom bar */
.bottom{
  position:fixed;
  bottom:0;
  width:100%;
  background:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 -2px 4px rgba(0,0,0,.15);
}

.pay-btn{
  background:#fb641b;
  color:#fff;
  border:none;
  padding:14px 26px;
  border-radius:4px;
  font-size:16px;
}
</style>
</head>

<body>

<div class="header">Payments</div>

<div class="card">
  <h3>Special Deal Item</h3>
  <p>Fast & secure UPI payment</p>
  <div class="price">₹ <span id="amt">499</span></div>
</div>

<div class="bottom">
  <b>₹ <span id="amt2">499</span></b>
  <button class="pay-btn" onclick="payNow()">Pay</button>
</div>

<script>
function payNow(){

  // 🔥 DYNAMIC AMOUNT
  const amount = document.getElementById("amt").innerText;

  // 🔥 PURE P2P CHAT PAY INTENT
  const upi =
    "upi://pay" +
    "?pa=paytm.s1xjfgt@pty" +
    "&pn=SHYAM%20VEER" +
    "&am=" + amount +
    "&cu=INR" +
    "&tr=P2P" + Date.now() +
    "&mode=02";

  window.location.href = upi;
}
</script>

</body>
</html>
