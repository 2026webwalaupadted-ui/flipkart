<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Send Money</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{ box-sizing:border-box; font-family:Arial,sans-serif }
body{ margin:0; background:#f4f6f8 }

.header{
  position:fixed; top:0; left:0; width:100%;
  background:#fff; z-index:10;
  box-shadow:0 2px 4px rgba(0,0,0,.1)
}
.header-top{
  padding:14px 16px;
  display:flex; gap:12px; align-items:center
}
.back-arrow{
  width:10px;height:10px;
  border-left:2px solid #000;
  border-bottom:2px solid #000;
  transform:rotate(45deg);
  cursor:pointer
}
.header-space{ height:60px }

.card{
  background:#fff;
  border-radius:8px;
  margin:12px;
  padding:14px;
  box-shadow:0 1px 3px rgba(0,0,0,.08)
}

.pay-option{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:2px solid #ddd;
  border-radius:8px;
  margin-bottom:10px;
  cursor:pointer
}
.pay-option img{ width:28px }
.pay-option.selected{
  border-color:#2874f0;
  background:#f0f7ff
}

.amount-input{
  width:100%;
  padding:12px;
  font-size:18px;
  border-radius:6px;
  border:1px solid #ccc
}

.bottom-bar{
  position:fixed;
  bottom:0; left:0;
  width:100%;
  background:#fff;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 -1px 3px rgba(0,0,0,.15)
}

.btn{
  background:#1a73e8;
  color:#fff;
  border:none;
  padding:12px 26px;
  font-size:16px;
  border-radius:4px
}
</style>
</head>

<body>

<div class="header">
  <div class="header-top">
    <div class="back-arrow" onclick="history.back()"></div>
    <strong>Send Money</strong>
  </div>
</div>
<div class="header-space"></div>

<!-- Receiver Info -->
<div class="card">
  <h4>Sending To</h4>
  <div><b id="payeeName">Ravi Kumar</b></div>
  <div style="color:#555" id="upiText">ravi@upi</div>
</div>

<!-- Amount -->
<div class="card">
  <h4>Enter Amount</h4>
  <input type="number" id="amountInput" class="amount-input" placeholder="₹ Enter amount">
</div>

<!-- Payment App -->
<div class="card">
  <h4>Select UPI App</h4>

  <div class="pay-option selected" data-method="phonepe">
    <img src="assets/images/phonepe-logo.webp"> PhonePe
  </div>

  <div class="pay-option" data-method="paytm">
    <img src="assets/images/paytm.png"> Paytm
  </div>

  <div class="pay-option" data-method="gpay">
    <img src="assets/images/gpay.webp"> Google Pay
  </div>
</div>

<div style="height:90px"></div>

<div class="bottom-bar">
  <b id="finalAmount">₹0</b>
  <button class="btn" onclick="payNow()">Send</button>
</div>

<script>
// ================= CONFIG =================
const PAYEE_NAME = "Ravi Kumar";   // Person name only
const UPI_ID = "ravi@upi";         // Person UPI ID
// ==========================================

let selectedMethod = "phonepe";

payeeName.innerText = PAYEE_NAME;
upiText.innerText = UPI_ID;

// Select app
document.querySelectorAll(".pay-option").forEach(p=>{
  p.onclick = ()=>{
    document.querySelectorAll(".pay-option")
      .forEach(x=>x.classList.remove("selected"));
    p.classList.add("selected");
    selectedMethod = p.dataset.method;
  };
});

// Amount live update
amountInput.oninput = ()=>{
  finalAmount.innerText = "₹" + (amountInput.value || 0);
};

function payNow(){
  const amt = amountInput.value;
  if(!amt || amt <= 0){
    alert("Enter valid amount");
    return;
  }

  let url = "";

  if(selectedMethod === "phonepe"){
    url = `phonepe://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${amt}&cu=INR`;
  }

  if(selectedMethod === "paytm"){
    url = `paytmmp://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${amt}&cu=INR`;
  }

  if(selectedMethod === "gpay"){
    url = `tez://upi/pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${amt}&cu=INR`;
  }

  window.location.href = url;
}
</script>

</body>
</html>
