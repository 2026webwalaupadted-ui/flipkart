<script>
// Network Management System
class NetworkManager {
    constructor() {
        this.isOnline = navigator.onLine;
        this.slowConnection = false;
        this.retryCount = 0;
        this.maxRetries = 3;
        this.requestTimeout = 10000; // 10 seconds
        
        this.initNetworkListeners();
    }
    
    initNetworkListeners() {
        window.addEventListener('online', () => this.handleOnline());
        window.addEventListener('offline', () => this.handleOffline());
        
        // Detect slow connection
        const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (connection) {
            this.slowConnection = connection.effectiveType === 'slow-2g' || 
                                 connection.effectiveType === '2g' ||
                                 connection.downlink < 1;
            
            connection.addEventListener('change', () => {
                this.slowConnection = connection.effectiveType === 'slow-2g' || 
                                     connection.effectiveType === '2g' ||
                                     connection.downlink < 1;
                this.updateNetworkStatus();
            });
        }
    }
    
    handleOnline() {
        this.isOnline = true;
        this.updateNetworkStatus();
        console.log('Network: Online');
    }
    
    handleOffline() {
        this.isOnline = false;
        this.updateNetworkStatus();
        console.log('Network: Offline');
        
        // Show offline warning
        this.showConnectionWarning('You are offline. Please check your internet connection.');
    }
    
    updateNetworkStatus() {
        const statusEl = document.getElementById('networkStatus');
        if (!statusEl) return;
        
        if (this.isOnline) {
            statusEl.textContent = this.slowConnection ? ' Slow Connection' : ' Online';
            statusEl.className = 'network-status online';
            
            if (this.slowConnection) {
                this.showConnectionWarning('Slow network detected. Loading optimized content...');
            } else {
                this.hideConnectionWarning();
            }
        } else {
            statusEl.textContent = ' Offline';
            statusEl.className = 'network-status offline';
        }
        
        setTimeout(() => {
            statusEl.style.display = 'none';
        }, 3000);
    }
    
    showConnectionWarning(message) {
        const warning = document.getElementById('connectionWarning');
        if (warning) {
            warning.querySelector('div').textContent = message;
            warning.classList.add('show');
        }
    }
    
    hideConnectionWarning() {
        const warning = document.getElementById('connectionWarning');
        if (warning) {
            warning.classList.remove('show');
        }
    }
}

// Product Manager
class ProductManager {
    constructor() {
        this.API_URL = "https://flipback-production.up.railway.app/api/products";
        this.productGrid = document.getElementById("productGrid");
        this.loadMoreBtn = document.getElementById("loadMoreBtn");
        this.loadMoreButton = document.getElementById("loadMoreButton");
        this.loadMoreStatus = document.getElementById("loadMoreStatus");
        
        this.allProducts = [];
        this.displayedProducts = 0;
        this.productsPerPage = 6;
        this.isLoading = false;
        this.networkManager = new NetworkManager();
        
        this.cacheKey = 'flipkart_products_cache';
        this.cacheExpiry = 5 * 60 * 1000;
        
        this.initializeLoadMore();
    }
    
    initializeLoadMore() {
        this.displayedProducts = 0;
        this.allProducts = [];
        
        this.loadMoreBtn.style.display = 'none';
        this.loadMoreStatus.style.display = 'none';
        
        this.loadMoreButton.onclick = () => this.handleLoadMore();
    }
    
    formatPrice(price) {
        if (price === undefined || price === null || price === '' || isNaN(price)) {
            return "₹0";
        }
        
        const num = parseFloat(price);
        if (isNaN(num)) return "₹0";
        
        return '₹' + num.toLocaleString('en-IN', {
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });
    }
    
    calculateDiscountPercent(originalPrice, discountedPrice) {
        if (!originalPrice || !discountedPrice || originalPrice <= 0 || discountedPrice <= 0) return 0;
        
        const original = parseFloat(originalPrice);
        const discounted = parseFloat(discountedPrice);
        
        if (isNaN(original) || isNaN(discounted) || original <= discounted) return 0;
        
        const discount = ((original - discounted) / original) * 100;
        return Math.round(discount);
    }
    
    getCachedProducts() {
        try {
            const cached = localStorage.getItem(this.cacheKey);
            if (!cached) return null;
            
            const { data, timestamp } = JSON.parse(cached);
            const now = Date.now();
            
            if (now - timestamp < this.cacheExpiry) {
                console.log('Loading from cache');
                return data;
            }
        } catch (error) {
            console.log('Cache error:', error);
        }
        return null;
    }
    
    cacheProducts(products) {
        try {
            const cacheData = {
                data: products,
                timestamp: Date.now()
            };
            localStorage.setItem(this.cacheKey, JSON.stringify(cacheData));
        } catch (error) {
            console.log('Failed to cache products:', error);
        }
    }
    
    async loadInitialProducts() {
        if (this.isLoading) return;
        
        this.isLoading = true;
        
        const cachedProducts = this.getCachedProducts();
        if (cachedProducts) {
            this.allProducts = cachedProducts;
            this.displayNextProducts();
            
            this.fetchFreshProducts();
            return;
        }
        
        await this.fetchProducts();
    }
    
    async fetchProducts() {
        try {
            this.networkManager.showConnectionWarning('Loading products...');
            
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            
            const response = await fetch(this.API_URL, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                signal: controller.signal
            }).catch(() => {
                throw new Error('Network request failed');
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }
            
            const data = await response.json();
            
            this.productGrid.innerHTML = '';
            
            if (data && data.data && Array.isArray(data.data) && data.data.length > 0) {
                this.allProducts = data.data.map((item, index) => ({
                    id: item.id || `product-${index}`,
                    ...item
                }));
                
                this.cacheProducts(this.allProducts);
                
                this.displayedProducts = 0;
                
                this.displayNextProducts();
                this.networkManager.hideConnectionWarning();
                
            } else if (data && Array.isArray(data) && data.length > 0) {
                this.allProducts = data.map((item, index) => ({
                    id: item.id || `product-${index}`,
                    ...item
                }));
                
                this.cacheProducts(this.allProducts);
                this.displayedProducts = 0;
                this.displayNextProducts();
                this.networkManager.hideConnectionWarning();
                
            } else {
                this.showNoProducts();
            }
            
        } catch (error) {
            console.error('Error loading products:', error);
            
            const cachedProducts = this.getCachedProducts();
            if (cachedProducts && cachedProducts.length > 0) {
                this.allProducts = cachedProducts;
                this.displayedProducts = 0;
                this.displayNextProducts();
                this.networkManager.showConnectionWarning('Showing cached data. Network seems slow.');
            } else {
                this.showError(error);
            }
            
        } finally {
            this.isLoading = false;
        }
    }
    
    async fetchFreshProducts() {
        try {
            const response = await fetch(this.API_URL, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            });
            
            if (response.ok) {
                const data = await response.json();
                if (data && data.data && Array.isArray(data.data) && data.data.length > 0) {
                    this.allProducts = data.data.map((item, index) => ({
                        id: item.id || `product-${index}`,
                        ...item
                    }));
                    
                    this.cacheProducts(this.allProducts);
                }
            }
        } catch (error) {
            console.log('Background fetch failed:', error);
        }
    }
    
    displayNextProducts() {
        console.log(`Displaying products. Total: ${this.allProducts.length}, Displayed: ${this.displayedProducts}`);
        
        if (this.allProducts.length === 0) {
            this.showNoProducts();
            return;
        }
        
        const startIndex = this.displayedProducts;
        const endIndex = Math.min(startIndex + this.productsPerPage, this.allProducts.length);
        
        console.log(`Displaying ${startIndex} to ${endIndex} (${endIndex - startIndex} products)`);
        
        if (startIndex === 0) {
            this.productGrid.innerHTML = '';
        }
        
        const fragment = document.createDocumentFragment();
        
        for (let i = startIndex; i < endIndex; i++) {
            const product = this.allProducts[i];
            
            if (!product) {
                console.warn(`No product at index ${i}`);
                continue;
            }
            
            const cardHtml = this.createProductCard(product);
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = cardHtml;
            const cardElement = tempDiv.firstElementChild;
            
            const imgElement = cardElement.querySelector('img');
            if (imgElement) {
                imgElement.classList.add('loading');
                this.lazyLoadImage(imgElement);
            }
            
            cardElement.addEventListener("click", () => {
                if (product.id) {
                    window.location.href = `view.html?id=${product.id}`;
                }
            });
            
            fragment.appendChild(cardElement);
        }
        
        this.productGrid.appendChild(fragment);
        this.displayedProducts = endIndex;
        
        console.log(`Now displayed: ${this.displayedProducts} out of ${this.allProducts.length}`);
        
        this.updateLoadMoreButton();
    }
    
    updateLoadMoreButton() {
        const remainingProducts = this.allProducts.length - this.displayedProducts;
        
        if (remainingProducts > 0) {
            this.loadMoreBtn.style.display = 'block';
            this.loadMoreButton.disabled = false;
            this.loadMoreButton.textContent = 'Next'; 
            this.loadMoreStatus.style.display = 'none';
        } else {
            this.loadMoreBtn.style.display = 'none';
            this.loadMoreStatus.style.display = 'block';
            this.loadMoreStatus.innerHTML = 'Showing all products';
        }
    }
    
    handleLoadMore() {
        console.log('Next clicked');
        
        if (this.isLoading) {
            console.log('Already loading...');
            return;
        }
        
        if (this.displayedProducts >= this.allProducts.length) {
            console.log('No more products to load');
            this.updateLoadMoreButton();
            return;
        }
        
        this.loadMoreButton.disabled = true;
        this.loadMoreButton.innerHTML = '<span class="loader"></span> Loading...';
    
        setTimeout(() => {
            this.displayNextProducts();
            
            this.loadMoreButton.disabled = false;
            this.loadMoreButton.textContent = 'Next'; 
        }, 500);
    }
    
    lazyLoadImage(imgElement) {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    
                    const src = img.getAttribute('data-src') || img.src;
                    
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        img.src = src;
                        img.classList.remove('loading');
                        img.classList.add('loaded');
                    };
                    tempImg.onerror = () => {
                        img.src = 'https://via.placeholder.com/400x400?text=Product+Image';
                        img.classList.remove('loading');
                        img.classList.add('loaded');
                    };
                    tempImg.src = src;
                    
                    observer.unobserve(img);
                }
            });
        }, {
            rootMargin: '50px'
        });
        
        observer.observe(imgElement);
    }
    
    createProductCard(p) {
        const originalPrice = p.price || 0;
        const discountAmount = p.discount_amount || 0;
        const discountPercent = p.discount_percent || 0;
        const discountedPrice = p.discounted_price || 0;
        
        let sellingPrice = discountedPrice;
        
        if (!sellingPrice && originalPrice && discountAmount) {
            sellingPrice = parseFloat(originalPrice) - parseFloat(discountAmount);
        } else if (!sellingPrice && originalPrice && discountPercent) {
            sellingPrice = parseFloat(originalPrice) * (1 - parseFloat(discountPercent)/100);
        } else if (!sellingPrice || sellingPrice === 0) {
            sellingPrice = parseFloat(originalPrice);
        }
        
        if (isNaN(sellingPrice)) sellingPrice = 0;
        
        let finalDiscountPercent = discountPercent;
        if (!finalDiscountPercent && originalPrice > 0 && sellingPrice > 0) {
            finalDiscountPercent = this.calculateDiscountPercent(originalPrice, sellingPrice);
        }
        
        const formattedOriginalPrice = this.formatPrice(originalPrice);
        const formattedSellingPrice = this.formatPrice(sellingPrice);
        
        const bankOfferPrice = sellingPrice > 0 ? sellingPrice * 0.95 : 0;
        const formattedBankOfferPrice = this.formatPrice(Math.round(bankOfferPrice));
        
        let imageSrc = "";
        if (p.image) {
            imageSrc = p.image;
        } else if (p.main_image) {
            imageSrc = p.main_image;
        } else {
            imageSrc = 'https://via.placeholder.com/400x400?text=Product+Image';
        }
        
        const productName = p.name || "Product Name";
        const isBestseller = Math.random() > 0.5;
        const isTrending = !isBestseller && Math.random() > 0.5;
        const rating = (Math.random() * 2 + 3).toFixed(1);
        const ratingCount = Math.floor(Math.random() * 1000) + 100;
        
        let displayDiscountPercent = finalDiscountPercent;
        if (finalDiscountPercent > 0) {
            displayDiscountPercent = finalDiscountPercent;
        }
        
        return `
            <div class="product-card" data-id="${p.id}">
                ${isBestseller ? '<div class="bestseller-badge">Bestseller</div>' : ''}
                ${isTrending ? '<div class="trending-badge">Trending</div>' : ''}
                
                <div class="product-img">
                    <img data-src="${imageSrc}" alt="${productName}" 
                         src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%23f8f8f8'/%3E%3C/svg%3E"
                         class="loading">
                </div>
                
                <div class="product-name-container">
                    <div class="product-name">${productName}</div>
                </div>
                
                <div class="price-container">
                    ${originalPrice > sellingPrice && sellingPrice > 0 ? 
                        `<span class="original-price">${formattedOriginalPrice}</span>` : 
                        ''
                    }
                    <span class="discounted-price">${formattedSellingPrice}</span>
                    ${finalDiscountPercent > 0 ? 
                        `<span class="discount-percent">↓${displayDiscountPercent}%</span>` : 
                        ''
                    }
                </div>
                
                <div class="offer-container">
                    <span class="wow-text">WOW!</span>
                    <span class="offer-price">${formattedBankOfferPrice} with Bank offer</span>
                </div>
                
                <div class="rating-container">
                    <span class="stars">${'★'.repeat(Math.floor(rating))}${rating % 1 >= 0.5 ? '★' : ''}</span>
                    <span class="rating-count">${ratingCount}</span>
                    <span class="assured-badge">Assured</span>
                </div>
            </div>
        `;
    }
    
    showNoProducts() {
        this.productGrid.innerHTML = `
            <div class="no-products">
                <p>No products available at the moment.</p>
                <p style="font-size: 14px; margin-top: 10px; color: #888;">Check back soon for new deals!</p>
            </div>
        `;
        this.loadMoreBtn.style.display = 'none';
        this.loadMoreStatus.style.display = 'none';
    }
    
    showError(error) {
        this.productGrid.innerHTML = `
            <div class="error-container">
                <div class="error-icon">⚠️</div>
                <div class="error-message">Failed to load products.</div>
                <p style="color: #666; margin-bottom: 20px;">Please check your internet connection.</p>
                <button id="retryLoadButton" class="retry-button">Retry Loading</button>
                <div class="error-details" style="margin-top: 15px;">
                    Error: ${error.message || 'Network error'}
                </div>
            </div>
        `;
        
        document.getElementById('retryLoadButton')?.addEventListener('click', () => {
            this.loadInitialProducts();
        });
        
        this.loadMoreBtn.style.display = 'none';
        this.loadMoreStatus.style.display = 'none';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    const productManager = new ProductManager();
    
    productManager.loadInitialProducts();
    
    function updateCountdownTimer() {
        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');
        
        let hours = parseInt(hoursElement.textContent) || 0;
        let minutes = parseInt(minutesElement.textContent) || 14;
        let seconds = parseInt(secondsElement.textContent) || 40;
        
        seconds--;
        
        if (seconds < 0) {
            seconds = 59;
            minutes--;
            
            if (minutes < 0) {
                minutes = 59;
                hours--;
                
                if (hours < 0) {
                    hours = 0;
                    minutes = 0;
                    seconds = 0;
                    
                    document.querySelector('.countdown-title').textContent = 'Flash Sale Ended!';
                    document.querySelector('.countdown-subtitle').textContent = 'Check back soon for more deals';
                    document.querySelector('.countdown-timer').style.display = 'none';
                    document.querySelector('.countdown-wrapper').style.background = 'linear-gradient(135deg, #666, #888)';
                    
                    clearInterval(timerInterval);
                    return;
                }
            }
        }
        
        hoursElement.textContent = hours.toString().padStart(2, '0');
        minutesElement.textContent = minutes.toString().padStart(2, '0');
        secondsElement.textContent = seconds.toString().padStart(2, '0');
    }
    
    const timerInterval = setInterval(updateCountdownTimer, 1000);
    
    // Promo slider
    const slider = document.getElementById("slider");
    const dots = document.querySelectorAll(".dot");
    const slides = document.querySelectorAll(".promo-card");
    let index = 0;
    const totalSlides = slides.length;
    
    function updateSlider() {
        const slideWidth = slider.clientWidth;
        slider.scrollTo({ left: index * slideWidth, behavior: "smooth" });
        dots.forEach(dot => dot.classList.remove("active"));
        if(dots[index]) dots[index].classList.add("active");
    }
    
    setInterval(() => { 
        index++; 
        if(index >= totalSlides) index = 0; 
        updateSlider(); 
    }, 3000);
    
    slider.addEventListener("scroll", () => {
        const slideWidth = slider.clientWidth;
        index = Math.round(slider.scrollLeft / slideWidth);
        dots.forEach(dot => dot.classList.remove("active"));
        if(dots[index]) dots[index].classList.add("active");
    });
    
    // Location selection
    document.querySelector('.select-location').addEventListener('click', function(event) {
        event.preventDefault();
        window.location.href = 'address.html';
    });
    
    // Search functionality
    const searchInput = document.getElementById('searchInput');
    let searchTimeout;
    
    searchInput.addEventListener('input', function(e) {
        clearTimeout(searchTimeout);
        
        searchTimeout = setTimeout(() => {
            const searchTerm = e.target.value.toLowerCase().trim();
            
            if (!searchTerm) {
                productManager.productGrid.innerHTML = '';
                productManager.displayedProducts = 0;
                productManager.displayNextProducts();
                return;
            }
            
            const filteredProducts = productManager.allProducts.filter(product => 
                product.name && product.name.toLowerCase().includes(searchTerm)
            );
            
            productManager.productGrid.innerHTML = '';
            
            if (filteredProducts.length === 0) {
                productManager.productGrid.innerHTML = `
                    <div class="no-products">
                        No products found for "${searchTerm}". Try a different search term.
                    </div>
                `;
                productManager.loadMoreBtn.style.display = 'none';
                productManager.loadMoreStatus.style.display = 'none';
            } else {
                filteredProducts.forEach(product => {
                    const cardHtml = productManager.createProductCard(product);
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = cardHtml;
                    const cardElement = tempDiv.firstElementChild;
                    
                    // Lazy load image
                    const imgElement = cardElement.querySelector('img');
                    if (imgElement) {
                        imgElement.classList.add('loading');
                        productManager.lazyLoadImage(imgElement);
                    }
                    
                    cardElement.addEventListener("click", () => {
                        if (product.id) {
                            window.location.href = `view.html?id=${product.id}`;
                        }
                    });
                    
                    productManager.productGrid.appendChild(cardElement);
                });
                
                productManager.loadMoreBtn.style.display = 'none';
                productManager.loadMoreStatus.style.display = 'block';
                productManager.loadMoreStatus.innerHTML = `Showing ${filteredProducts.length} search results`;
            }
        }, 500);
    });
    
    document.getElementById('retryButton')?.addEventListener('click', () => {
        productManager.loadInitialProducts();
    });
    
    // Handle visibility change - refresh when tab becomes active
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            // Refresh cache after 10 minutes
            const cacheTime = localStorage.getItem('flipkart_products_cache_timestamp');
            if (cacheTime && Date.now() - parseInt(cacheTime) > 600000) {
                productManager.fetchFreshProducts();
            }
        }
    });
    
    // Add offline detection
    window.addEventListener('offline', () => {
        const networkStatus = document.getElementById('networkStatus');
        if (networkStatus) {
            networkStatus.textContent = ' Offline';
            networkStatus.className = 'network-status offline';
            networkStatus.style.display = 'block';
        }
    });
    
    window.addEventListener('online', () => {
        const networkStatus = document.getElementById('networkStatus');
        if (networkStatus) {
            networkStatus.textContent = ' Back Online';
            networkStatus.className = 'network-status online';
            networkStatus.style.display = 'block';
            
            setTimeout(() => {
                productManager.fetchFreshProducts();
            }, 1000);
        }
    });
    console.log('Product Manager initialized');
});
</script>
</body>
